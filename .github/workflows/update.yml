name: Update Taiwan bottom radar
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * 1-5' # 18:40 Asia/Taipei (UTC+8); holidays may have no new data
permissions:
  contents: write
  pages: write
concurrency:
  group: radar-data-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/update.py
        env:
          MAX_FETCH: '75'
      - name: Commit data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          git diff --cached --quiet || (git commit -m 'Update radar data' && git push origin HEAD:main)
      - name: Request branch-based Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
